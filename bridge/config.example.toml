# harness-bridge configuration (copy to config.toml next to codex_bridge.py, chmod 600).
# Every value here is an example placeholder. Nothing in this file is a secret, but it does
# describe your network; do NOT commit your real config.toml (it is in .gitignore).

[server]
bind_host   = "100.x.y.z"        # this Mac's tailnet IP (`tailscale ip -4`). Never 0.0.0.0.
# allow_loopback_for_tests = false # test-only opt-in for 127.0.0.1; never wildcard
port        = 18542              # default; any free port works, keep ACL + dispatcher in sync
host_label  = "mac-a"            # short label sent as "host" in the webhook payload
require_token = true            # default; disabling removes application authentication
# token_file = "/path/to/bridge.token"  # default: <bridge dir>/bridge.token; owned file, mode 0600
# HARNESS_BRIDGE_TOKEN_FILE overrides token_file (path only; never the token itself)
# webhook_url_prefix = "https://hooks.example/hook" # optional exact origin + path boundary allowlist
max_workers = 4                  # concurrent jobs shared by both backends
job_timeout_seconds = 3600
max_body_bytes = 16000
tailscale_bin = "/usr/local/bin/tailscale"   # or /Applications/Tailscale.app/Contents/MacOS/Tailscale
# journal      = "/path/to/jobs.json"        # default: <bridge dir>/jobs.json
# webhook_conf = "/path/to/webhook.conf"     # default: <bridge dir>/webhook.conf

[workspace]
path = "/Users/<you>/src"        # fixed working directory for both engines

[codex]
bin = "/Users/<you>/.local/bin/codex"
# home = "/Users/<you>/.codex"   # default: $CODEX_HOME or ~/.codex
sandbox = "workspace-write"
# Optional relaxation: removes filesystem sandboxing; jobs can access or modify files
# outside the workspace with your user privileges. Enable only on a trusted host.
# sandbox = "danger-full-access"
approval_policy = "never"

[claude]
bin = "claude"                   # or an absolute path
shell = "/bin/zsh"
path_prepend = ["/Users/<you>/.local/bin", "/opt/homebrew/bin"]
# env_script = "/Users/<you>/.config/<gateway>/active.zsh"  # optional; sourced before claude
permission_mode = "dontAsk"
model_mode = "flag"              # "flag" = claude --model <m>; "switch" = use switch_helper
# switch_helper = "/Users/<you>/tools/model-switch/run.sh"  # must support: <helper> export <model>

[access]
# Callers allowed to use the API. The source IP must be listed AND `tailscale whois` must confirm it.
allowed_sources = [
  { ip = "100.x.y.1", tag  = "tag:<dispatcher-tag>", token_files = ["/private/box-current", "/private/box-next"] },        # the dispatcher box (tagged node)
  { ip = "100.x.y.2", node = "<peer-node>.<tailnet>.ts.net" }, # optional: another trusted machine
]
