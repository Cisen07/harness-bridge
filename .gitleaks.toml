title = "harness-bridge gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "bot-webhook-url-with-id"
description = "Routine webhook URL containing a path id"
regex = '''https?://[A-Za-z0-9.-]+/(automations/)?webhooks?/[A-Za-z0-9_-]{8,}'''

[[rules]]
id = "bearer-literal"
description = "Literal Bearer token"
regex = '''Bearer\s+[A-Za-z0-9_\-\.]{16,}'''

[[rules]]
id = "platform-key-prefix"
description = "Platform API keys by prefix"
regex = '''\b(crsr|gho|ghp|ghs|github_pat|sk|xox[abp]|tskey)[-_][A-Za-z0-9_\-]{12,}'''
